<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="1024" height="1024">
    <defs>
        <linearGradient id="paper" x1="0" y1="0" x2="0.4" y2="1">
            <stop offset="0%" stop-color="#fbf6ec" />
            <stop offset="60%" stop-color="#f1e7d6" />
            <stop offset="100%" stop-color="#e4ead8" />
        </linearGradient>
        <radialGradient id="warmth" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0%" stop-color="#e6c48e" stop-opacity="0.35" />
            <stop offset="100%" stop-color="#e6c48e" stop-opacity="0" />
        </radialGradient>
        <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#9a6a2c" />
            <stop offset="55%" stop-color="#5c3a1c" />
            <stop offset="100%" stop-color="#a4502a" />
        </linearGradient>
        <filter id="brush" x="-20%" y="-20%" width="140%" height="140%">
            <feTurbulence type="fractalNoise" baseFrequency="0.18" numOctaves="2" seed="5" result="wobble" />
            <feDisplacementMap in="SourceGraphic" in2="wobble" scale="1.4" xChannelSelector="R" yChannelSelector="G" />
        </filter>
    </defs>

    <rect width="40" height="40" fill="url(#paper)" />
    <circle cx="20" cy="20" r="14" fill="url(#warmth)" />

    <!-- Same mark as the in-app logo, scaled to sit inside the maskable safe zone. -->
    <g transform="translate(20 20) scale(0.7) translate(-20 -20)">
        <g fill="none" stroke="url(#ink)" stroke-linecap="round" filter="url(#brush)">
            <path pathLength="100" stroke-width="1.9" stroke-dasharray="100 200" d="M 31.26 13.5 A 13 13 0 1 0 32.8 22.26" />
            <path pathLength="100" stroke-width="2.9" stroke-dasharray="84 200" d="M 31.26 13.5 A 13 13 0 1 0 32.8 22.26" />
            <path pathLength="100" stroke-width="3.9" stroke-dasharray="62 200" d="M 31.26 13.5 A 13 13 0 1 0 32.8 22.26" />
            <path pathLength="100" stroke-width="4.9" stroke-dasharray="36 200" d="M 31.26 13.5 A 13 13 0 1 0 32.8 22.26" />
        </g>
        <circle cx="20" cy="20" r="2.7" fill="#a4502a" />
    </g>
</svg>
